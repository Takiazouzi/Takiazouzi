# =============================================================================
# GitHub Actions Workflow: main
# Purpose: Test, build, and deploy the GitHub contribution snake animation generator
# =============================================================================

name: main

# Trigger this workflow on every push to any branch
on: [push]

jobs:
  # ---------------------------------------------------------------------------
  # Job: test
  # Purpose: Run standard project tests (type checking, linting, unit tests)
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository code at the specific commit
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      
      # Set up Bun JavaScript runtime with pinned version for reproducibility
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.12

      # Install dependencies using frozen lockfile to ensure consistent installs
      - run: bun install --frozen-lockfile

      # Run type checking, linting, and test suites
      - run: npm run type
      - run: npm run lint
      - run: bun test
        env:
          # Provide GitHub token for API rate limit handling during tests
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Job: test-lib
  # Purpose: Test the library build and CLI execution in an isolated environment
  # ---------------------------------------------------------------------------
  test-lib:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.12

      - run: bun install --frozen-lockfile

      # Build the library package for distribution
      - run: bun build:lib

      # Move the built library to a temporary directory for isolated testing
      - run: mv ./packages/generate-snake-animation/dist ${{ runner.temp }}/snk

      # Test CLI execution via npx using the locally built package
      - name: run via npx
        run: |
          npx --yes file:${{ runner.temp }}/snk --github_user=platane --output=snake.svg
          test -f snake.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Verify SVG output was generated
      - run: test -f snake.svg

      # Install native dependencies (canvas, gif encoding) in isolated temp environment
      - name: install dependencies canvas, gifslice.. in the isolated env parent dir
        run: bun add --cwd ${{ runner.temp }} canvas@3.2.0 gif-encoder-2@1.0.5 gifsicle@5.3.0

      # Test GIF generation via direct CLI call
      - run: bun ${{ runner.temp }}/snk/cli.js --github_user=platane --output=snake.gif
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Verify GIF output was generated
      - run: test -f snake.gif

  # ---------------------------------------------------------------------------
  # Job: test-action
  # Purpose: Test the full GitHub Action with multiple output formats and themes
  # ---------------------------------------------------------------------------
  test-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      # Modify action.yml to use local Dockerfile instead of pre-built image for testing
      - name: update action.yml to use image from local Dockerfile
        run: |
          sed -i "s/image: .*/image: Dockerfile/" action.yml

      # Execute the snake animation generator action with multiple output configurations
      - name: generate-snake-game-from-github-contribution-grid
        id: generate-snake
        uses: ./
        with:
          github_user_name: ${{github.Takiazouzi}}
          # Generate multiple themed outputs: default, dark, ocean, grey + GIF variants
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake-ocean.svg?color_snake=orange&color_dots=#dadcdf94,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
            dist/github-contribution-grid-snake-grey.svg?color_snake=111&color_dots=#eee,#aaa,#888,#666,#444
            dist/github-contribution-grid-snake.gif
            dist/github-contribution-grid-snake-dark.gif?palette=github-dark
            dist/github-contribution-grid-snake-ocean.gif?color_snake=orange&color_dots=#dadcdf94,#8dbdff,#64a1f4,#4b91f1,#3c7dd9&color_background=#f7f8fa

      # Verify all expected output files were generated successfully
      - name: ensure the generated file exists
        run: |
          ls dist
          test -f dist/github-contribution-grid-snake.svg
          test -f dist/github-contribution-grid-snake-dark.svg
          test -f dist/github-contribution-grid-snake-ocean.svg
          test -f dist/github-contribution-grid-snake-grey.svg
          test -f dist/github-contribution-grid-snake.gif
          test -f dist/github-contribution-grid-snake-dark.gif
          test -f dist/github-contribution-grid-snake-ocean.gif

      # Deploy generated files to GitHub Pages 'output' branch for public access
      - uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Job: test-action-svg-only
  # Purpose: Test the lightweight SVG-only variant of the action (no GIF dependencies)
  # ---------------------------------------------------------------------------
  test-action-svg-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.12

      - run: bun install --frozen-lockfile

      # Build only the SVG-only action variant (smaller footprint, no canvas/gif deps)
      - name: build svg-only action
        run: |
          npm run build:action
          rm -r svg-only/dist
          mv packages/action/dist svg-only/dist

      # Run the svg-only action with multiple theme configurations
      - name: generate-snake-game-from-github-contribution-grid
        id: generate-snake
        uses: ./svg-only
        with:
          github_user_name: platane
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake-ocean.svg?color_snake=orange&color_dots=#dadcdf94,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
            dist/github-contribution-grid-snake-grey.svg?color_snake=111&color_dots=#eee,#aaa,#888,#666,#444

      # Verify SVG outputs were generated
      - name: ensure the generated file exists
        run: |
          ls dist
          test -f dist/github-contribution-grid-snake.svg
          test -f dist/github-contribution-grid-snake-dark.svg
          test -f dist/github-contribution-grid-snake-ocean.svg
          test -f dist/github-contribution-grid-snake-grey.svg

      # Deploy SVG-only outputs to separate 'output-svg-only' branch
      - uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: output-svg-only
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Job: deploy-ghpages
  # Purpose: Build and deploy the interactive demo site + backend service
  # Permissions: Required for GitHub Pages deployment and Cloudflare Workers
  # ---------------------------------------------------------------------------
  deploy-ghpages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.12

      - run: bun install --frozen-lockfile

      # Build the demo application with custom API endpoint for user contributions
      - run: npm run build:demo
        env:
          GITHUB_USER_CONTRIBUTION_API_ENDPOINT: https://github-user-contribution.platane.workers.dev/github-user-contribution/

      # Upload built demo files as GitHub Pages artifact
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: packages/demo/dist

      # Deploy to GitHub Pages (only on main branch + successful build)
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        if: success() && github.ref == 'refs/heads/main'

      # Deploy backend Cloudflare Worker service for contribution API (main branch only)
      - run: bun wrangler deploy
        if: success() && github.ref == 'refs/heads/main'
        working-directory: packages/github-user-contribution-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
