# ============================================================
# 🐍 Generate Snake Animation for GitHub Profile README
# User: Takiazouzi | Repo: Takiazouzi/Takiazouzi
# 
# ✅ NODE.JS 24 COMPATIBLE - Using verified action versions
# ============================================================

name: Generate Snake Animation

on:
  schedule:
    - cron: "*/1 * * * *"        # Daily at midnight UTC
  workflow_dispatch:           # Allow manual trigger
  push:
    branches: [main]           # Run on push to main

# 🌍 Force JavaScript actions to use Node.js 24 (prevents deprecation warnings)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # Required to push generated files
    
    steps:
      # ------------------------------------------------------------
      # STEP 1: Checkout repository
      # ✅ Using v5.0.0 - Node.js 24 compatible (requires runner v2.327.1+)
      # Your runner: 2.334.0 ✓ meets requirement
      # ------------------------------------------------------------
      - uses: actions/checkout@v5.0.0

      # ------------------------------------------------------------
      # STEP 2: Generate snake animation
      # ✅ Platane/snk@v3 is already Node.js 24 compatible
      # ------------------------------------------------------------
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Takiazouzi   # 👈 Your GitHub username (case-sensitive)
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            # dist/github-contribution-grid-snake.gif  # Uncomment for GIF output

      # ------------------------------------------------------------
      # STEP 3: Deploy to output branch
      # ✅ Using v5.0.0 - Node.js 24 compatible (requires runner v2.327.1+)
      # ------------------------------------------------------------
      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output              # Branch for generated files
          build_dir: dist                    # Folder to deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
