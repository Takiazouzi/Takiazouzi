# .github/workflows/generate-snake.yml
name: Generate Snake Animation

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *" # Daily update
  workflow_dispatch: # Allow manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3 # 👈 Use the pre-built action
        with:
          github_user_name: Takiazouzi # 👈 [CUSTOMIZE] Your GitHub username
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output # 👈 [CUSTOMIZE] Branch where snake files will be stored
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
