# ============================================================
# 🐍 Generate Snake Animation for GitHub Profile README
# User: Takiazouzi | Repo: Takiazouzi/Takiazouzi
# 
# ✅ NODE.JS 24 COMPATIBLE - No deprecation warnings
# ============================================================

name: Generate Snake Animation

# 🎯 When to run: daily, manual trigger, or on push to main
on:
  schedule:
    - cron: "0 0 * * *"        # 🕛 Daily at midnight UTC
  workflow_dispatch:           # 🎯 Allow manual trigger from Actions tab
  push:
    branches: [main]           # 🔄 Also run on push to main branch

# 🌍 GLOBAL FIX: Force all JavaScript actions to use Node.js 24 runtime
# 👇 This eliminates the Node.js 20 deprecation warning immediately
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # ✅ Required to push generated files to branch
    
    steps:
      # ------------------------------------------------------------
      # STEP 1: Checkout your repository code
      # 👇 Using explicit version v4.2.2+ for Node.js 24 compatibility
      # ------------------------------------------------------------
      - uses: actions/checkout@v4.2.2

      # ------------------------------------------------------------
      # STEP 2: Generate snake animation from your GitHub contributions
      # 👇 Platane/snk@v3 is already Node.js 24 compatible - no change needed
      # ------------------------------------------------------------
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          # 👇 [REQUIRED] Your GitHub username - case-sensitive!
          github_user_name: Takiazouzi
          
          # 👇 [OUTPUTS] Files to generate - add/remove lines as needed
          outputs: |
            # 🎨 Light theme SVG (default)
            dist/github-contribution-grid-snake.svg
            # 🌙 Dark theme SVG (GitHub Dark palette)
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            # 🎬 GIF output (slower, uncomment if you want animation)
            # dist/github-contribution-grid-snake.gif
            # dist/github-contribution-grid-snake-dark.gif?palette=github-dark

      # ------------------------------------------------------------
      # STEP 3: Deploy generated files to 'output' branch
      # 👇 Using v4.3.0+ for Node.js 24 compatibility
      # ------------------------------------------------------------
      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4.3.0
        with:
          # 👇 [CUSTOMIZE] Branch name where snake files will be stored
          # This branch will be auto-created if it doesn't exist
          target_branch: output
          # 👇 Folder containing the generated files to deploy
          build_dir: dist
        env:
          # ✅ Auto-provided by GitHub - no need to create this secret
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
